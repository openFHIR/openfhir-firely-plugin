# Release workflow
#
# How to cut a release:
#   1. Keep the "## [Unreleased]" section of CHANGELOG.md up to date as changes merge
#   2. Run this workflow from the Actions tab (workflow_dispatch) on main and
#      enter the release version (e.g. 2.1.0)
#
# The workflow first runs the full E2E suite (e2e.yml, tests/test.sh) as a hard
# gate — this runs for dry runs too, so a dry run tells you whether the real
# release would pass. It then:
#   - stamps the version into the csproj <Version>
#   - promotes the CHANGELOG "Unreleased" section to the new version (or reuses
#     an existing "## [x.y.z]" section if one is already present)
#   - builds, unit-tests and packages the publish output as a zip
#   - commits the csproj/CHANGELOG changes, tags "x.y.z" (matching the existing
#     tag convention) and pushes
#   - creates a GitHub release whose notes combine the changelog section with
#     the Firely Server compatibility derived from the Vonk SDK version
# A dry run does everything except commit, tag, push and publish.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0) — must not already be tagged'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and print the notes, but do not commit, tag, push or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PROJECT: src/OpenFhirFirelyPlugin/OpenFhirFirelyPlugin.csproj

jobs:
  # Full E2E suite (tests/test.sh via e2e.yml) must pass before the release
  # tag — the irreversible step — is created.
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    name: Release ${{ inputs.version }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 2.1.0 or 2.1.0-rc1)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Set version in csproj
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" "$PROJECT"
          if ! grep -q "<Version>$VERSION</Version>" "$PROJECT"; then
            echo "::error::Failed to set <Version> in $PROJECT"
            exit 1
          fi
          echo "csproj <Version> set to $VERSION"

      - name: Read Vonk SDK version
        id: vonk
        run: |
          VONK_VERSION=$(grep -oPm1 'Include="Vonk\.Core"\s+Version="\K[^"]+' "$PROJECT")
          if [ -z "$VONK_VERSION" ]; then
            echo "::error::Could not read the Vonk.Core package version from $PROJECT"
            exit 1
          fi
          FIRELY_VERSION="${VONK_VERSION%%-*}"
          echo "vonk_version=$VONK_VERSION"       >> "$GITHUB_OUTPUT"
          echo "firely_version=$FIRELY_VERSION"   >> "$GITHUB_OUTPUT"

      - name: Promote CHANGELOG Unreleased section
        env:
          VERSION: ${{ inputs.version }}
          FIRELY_VERSION: ${{ steps.vonk.outputs.firely_version }}
          VONK_VERSION: ${{ steps.vonk.outputs.vonk_version }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release_changelog.py

      - name: Assemble release notes
        env:
          VERSION: ${{ inputs.version }}
          FIRELY_VERSION: ${{ steps.vonk.outputs.firely_version }}
          VONK_VERSION: ${{ steps.vonk.outputs.vonk_version }}
        run: |
          {
            echo "Firely Server plugin that routes clinical data between FHIR clients and an openEHR CDR via openFHIR."
            echo
            echo "**Compatibility:** Firely Server ${FIRELY_VERSION} or later (built against Vonk SDK \`${VONK_VERSION}\`) · .NET 8 · FHIR STU3 / R4 / R5"
            echo
            echo "## Changes"
            cat release-notes-changelog.md
            echo
            echo "## Installation"
            echo
            echo "Extract \`openfhir-firely-plugin-${VERSION}.zip\` into your Firely Server \`plugins\` directory and register the plugin in \`appsettings.json\` — see the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/README.md) for details."
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OpenFhirFirelyPlugin.sln

      - name: Build
        run: dotnet build OpenFhirFirelyPlugin.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test OpenFhirFirelyPlugin.sln --configuration Release --no-build --verbosity normal

      - name: Package plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish "$PROJECT" --configuration Release --no-build --output out/openfhir-firely-plugin
          if [ ! -f out/openfhir-firely-plugin/OpenFhirFirelyPlugin.dll ]; then
            echo "::error::Publish output is missing OpenFhirFirelyPlugin.dll"
            exit 1
          fi
          (cd out/openfhir-firely-plugin && zip -r "../openfhir-firely-plugin-${VERSION}.zip" .)
          ls -la out/

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$PROJECT" CHANGELOG.md
          if git diff --cached --quiet; then
            echo "csproj and CHANGELOG already match $VERSION — tagging current HEAD"
          else
            git commit -m "Release $VERSION"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --title "openFHIR Firely Plugin $VERSION" \
            --notes-file release-notes.md \
            "${FLAGS[@]}" \
            "out/openfhir-firely-plugin-${VERSION}.zip"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo '## Dry run — nothing was committed, tagged, pushed or published'
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
