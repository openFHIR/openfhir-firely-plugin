# Build and unit-test on every push and pull request — fast feedback.
# The full E2E suite (tests/test.sh) runs in e2e.yml on every PR and as a
# gate in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OpenFhirFirelyPlugin.sln

      - name: Build
        run: dotnet build OpenFhirFirelyPlugin.sln --configuration Release --no-restore --warnaserror

      - name: Unit tests
        run: dotnet test OpenFhirFirelyPlugin.sln --configuration Release --no-build --verbosity normal
